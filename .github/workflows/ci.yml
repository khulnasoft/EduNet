name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: edunet_test_only_password
          POSTGRES_DB: edunet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d edunet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:edunet_test_only_password@localhost:5432/edunet_test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: edunet_test_only_password
      DB_NAME: edunet_test
      JWT_SECRET: edunet-ci-only-secret-with-at-least-32-characters
      BCRYPT_COST: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm --filter @edunet/database migrate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: PostgreSQL integration tests
        run: pnpm --filter @edunet/database test:integration
      - name: Unit tests and build
        run: pnpm test
      - name: Install Playwright Chromium
        run: pnpm --filter @edunet/web exec playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: pnpm --filter @edunet/web test:e2e
